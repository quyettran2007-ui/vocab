<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📝 Vocab Notes – by Quyet</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-gradient-start: #080818;
            --bg-gradient-mid: #0d0d2b;
            --bg-gradient-end: #121230;
            --glass-bg: rgba(255, 255, 255, 0.04);
            --glass-bg-strong: rgba(255, 255, 255, 0.07);
            --glass-border: rgba(255, 255, 255, 0.09);
            --glass-border-bright: rgba(255, 255, 255, 0.18);
            --glass-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 1px 0 rgba(255,255,255,0.07) inset;
            --glass-blur: blur(24px);
            --text-primary: #f0f2ff;
            --text-secondary: #8b91c4;
            --text-muted: #555a8a;
            --accent: #818cf8;
            --accent-2: #a78bfa;
            --accent-glow: rgba(129, 140, 248, 0.4);
            --accent-glow-2: rgba(167, 139, 250, 0.3);
            --highlight-bg: rgba(251, 191, 36, 0.22);
            --highlight-text: #fbbf24;
            --card-hover-bg: rgba(255, 255, 255, 0.08);
            --note-bg: rgba(0, 0, 0, 0.25);
            --note-border: rgba(255, 255, 255, 0.1);
            --note-focus-border: #818cf8;
            --btn-bg: rgba(255, 255, 255, 0.06);
            --btn-border: rgba(255, 255, 255, 0.12);
            --btn-hover-bg: rgba(255, 255, 255, 0.12);
            --danger: #f87171;
            --success: #34d399;
            --border-radius: 20px;
            --border-radius-sm: 12px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --overlay-bg: rgba(0, 0, 0, 0.8);
            --blob1: #4f46e5;
            --blob2: #7c3aed;
            --blob3: #2563eb;
            --badge-text: #fff;
            --placeholder-color: #4f5580;
            --textarea-color: #c4caed;
            --indicator-color: #6f74a0;
            --toast-bg: rgba(15,15,40,0.92);
            --toast-text: #f0f2ff;
            --tag-bg: rgba(129, 140, 248, 0.15);
            --tag-text: #a5b0ff;
            --tag-border: rgba(129, 140, 248, 0.25);
        }
        [data-theme="light"] {
            --bg-gradient-start: #eef0fb;
            --bg-gradient-mid: #e8eaf8;
            --bg-gradient-end: #dfe3f5;
            --glass-bg: rgba(255, 255, 255, 0.55);
            --glass-bg-strong: rgba(255, 255, 255, 0.75);
            --glass-border: rgba(255, 255, 255, 0.8);
            --glass-border-bright: rgba(255, 255, 255, 0.95);
            --glass-shadow: 0 20px 60px rgba(79, 70, 229, 0.1), 0 1px 0 rgba(255,255,255,0.9) inset;
            --text-primary: #1a1d3a;
            --text-secondary: #4a5080;
            --text-muted: #8890c0;
            --accent: #4f46e5;
            --accent-2: #7c3aed;
            --accent-glow: rgba(79, 70, 229, 0.25);
            --accent-glow-2: rgba(124, 58, 237, 0.2);
            --highlight-bg: rgba(251, 191, 36, 0.3);
            --highlight-text: #92400e;
            --card-hover-bg: rgba(255, 255, 255, 0.85);
            --note-bg: rgba(0, 0, 0, 0.03);
            --note-border: rgba(0, 0, 0, 0.1);
            --note-focus-border: #4f46e5;
            --btn-bg: rgba(255, 255, 255, 0.5);
            --btn-border: rgba(0, 0, 0, 0.08);
            --btn-hover-bg: rgba(255, 255, 255, 0.85);
            --overlay-bg: rgba(0, 0, 0, 0.5);
            --blob1: #c7d2fe;
            --blob2: #ddd6fe;
            --blob3: #bfdbfe;
            --badge-text: #1a1d3a;
            --placeholder-color: #9095b8;
            --textarea-color: #2a2d4a;
            --indicator-color: #5a5e80;
            --toast-bg: rgba(26,29,58,0.92);
            --toast-text: #f0f2ff;
            --tag-bg: rgba(79, 70, 229, 0.1);
            --tag-text: #3730a3;
            --tag-border: rgba(79, 70, 229, 0.2);
        }

        * { margin:0; padding:0; box-sizing:border-box; }

        body {
            font-family: 'DM Sans', 'Inter', sans-serif;
            background: linear-gradient(155deg, var(--bg-gradient-start) 0%, var(--bg-gradient-mid) 50%, var(--bg-gradient-end) 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 36px 20px 80px;
            color: var(--text-primary);
            transition: background 0.5s, color 0.3s;
            overflow-x: hidden;
        }

        /* Atmospheric blobs */
        body::before, body::after { content:""; position:fixed; border-radius:50%; z-index:0; pointer-events:none; }
        body::before {
            width: 700px; height: 700px;
            background: radial-gradient(circle at 40% 40%, var(--blob1), transparent 65%);
            top: -200px; right: -200px;
            opacity: 0.18;
            filter: blur(80px);
            animation: floatBlob 18s infinite alternate;
        }
        body::after {
            width: 500px; height: 500px;
            background: radial-gradient(circle at 60% 60%, var(--blob2), transparent 65%);
            bottom: -150px; left: -150px;
            opacity: 0.15;
            filter: blur(80px);
            animation: floatBlob 24s infinite alternate-reverse;
        }
        .blob3 {
            position: fixed; z-index: 0; pointer-events: none;
            width: 400px; height: 400px;
            background: radial-gradient(circle, var(--blob3), transparent 65%);
            top: 40%; left: -100px;
            opacity: 0.1;
            filter: blur(80px);
            animation: floatBlob 20s 5s infinite alternate;
            border-radius: 50%;
        }

        @keyframes floatBlob {
            0% { transform: translate(0,0) scale(1); }
            100% { transform: translate(40px,-60px) scale(1.15); }
        }

        .main-container {
            position: relative; z-index: 2;
            width: 100%; max-width: 1000px;
            display: flex; flex-direction: column; gap: 20px;
            animation: pageIn 0.6s cubic-bezier(0.16,1,0.3,1) both;
        }

        @keyframes pageIn {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== HEADER CARD ===== */
        .header-card {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-top: 1px solid var(--glass-border-bright);
            border-radius: var(--border-radius);
            padding: 28px 32px 24px;
            box-shadow: var(--glass-shadow);
            position: relative;
            overflow: hidden;
        }
        .header-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
        }

        .header-top {
            display: flex; justify-content: space-between;
            align-items: center; gap: 14px; flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .logo-area {
            display: flex; align-items: center; gap: 12px;
        }
        .logo-icon {
            width: 44px; height: 44px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.3rem;
            box-shadow: 0 4px 20px var(--accent-glow);
            flex-shrink: 0;
        }
        .title {
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            font-size: 1.45rem;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, var(--text-primary) 30%, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .badge-count {
            background: var(--glass-bg-strong);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 40px;
            padding: 8px 18px;
            font-weight: 600;
            font-size: 0.82rem;
            color: var(--text-secondary);
            white-space: nowrap;
        }
        .badge-count span { color: var(--accent); font-weight: 700; }

        /* ===== SEARCH ===== */
        .search-wrapper {
            position: relative; display: flex; align-items: center;
            margin-bottom: 16px;
        }
        .search-icon { position: absolute; left: 18px; color: var(--text-muted); z-index: 3; font-size: 1rem; }
        #searchInput {
            width: 100%; padding: 14px 48px 14px 50px;
            border-radius: 50px;
            border: 1px solid var(--btn-border);
            background: var(--note-bg);
            color: var(--text-primary);
            font-size: 0.95rem;
            font-family: 'DM Sans', sans-serif;
            backdrop-filter: blur(12px);
            transition: border-color var(--transition), box-shadow var(--transition);
            outline: none;
        }
        #searchInput:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        #searchInput::placeholder { color: var(--placeholder-color); }
        .clear-search-btn {
            position: absolute; right: 12px;
            background: var(--btn-bg); border: 1px solid var(--btn-border);
            width: 30px; height: 30px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: var(--text-secondary); font-size: 0.8rem;
            transition: var(--transition);
        }
        .clear-search-btn:hover { background: var(--danger); color: #fff; border-color: transparent; }
        .hidden { display: none !important; }

        /* ===== TOOLBAR ===== */
        .toolbar {
            display: flex; flex-wrap: wrap; gap: 6px;
            align-items: center; margin-bottom: 16px;
        }
        .toolbar .btn {
            padding: 8px 16px; border-radius: 50px;
            border: 1px solid var(--btn-border);
            background: var(--btn-bg);
            color: var(--text-secondary);
            font-weight: 600; font-size: 0.78rem;
            font-family: 'DM Sans', sans-serif;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: all var(--transition);
            white-space: nowrap;
            letter-spacing: 0.01em;
        }
        .toolbar .btn:hover {
            background: var(--btn-hover-bg);
            border-color: var(--glass-border-bright);
            color: var(--text-primary);
            transform: translateY(-1px);
        }
        .toolbar .btn.active {
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            border-color: transparent;
            color: #fff;
            box-shadow: 0 4px 16px var(--accent-glow);
        }
        .btn-sort-group {
            display: flex; gap: 2px;
            background: var(--note-bg);
            border-radius: 50px; padding: 3px;
            border: 1px solid var(--btn-border);
        }
        .btn-sort-group .btn {
            border: none; background: transparent;
            padding: 6px 13px;
        }
        .btn-sort-group .btn.active {
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            box-shadow: 0 2px 10px var(--accent-glow);
        }

        /* Tag filter select */
        #tagFilterSelect {
            padding: 8px 14px; border-radius: 50px;
            border: 1px solid var(--btn-border);
            background: var(--btn-bg);
            color: var(--text-secondary);
            font-weight: 600; font-size: 0.78rem;
            font-family: 'DM Sans', sans-serif;
            backdrop-filter: blur(8px);
            cursor: pointer; max-width: 160px;
            outline: none;
            transition: all var(--transition);
        }
        #tagFilterSelect:hover, #tagFilterSelect:focus {
            border-color: var(--accent);
            color: var(--text-primary);
        }

        /* ===== ADD WORD ROW ===== */
        .add-word-row {
            display: flex; gap: 8px; flex-wrap: wrap;
            padding: 16px;
            background: var(--note-bg);
            border-radius: var(--border-radius-sm);
            border: 1px solid var(--btn-border);
        }
        .add-word-row input {
            flex: 1 1 110px; padding: 10px 16px;
            border-radius: 50px; border: 1px solid var(--btn-border);
            background: var(--glass-bg);
            color: var(--text-primary);
            font-size: 0.88rem; font-family: 'DM Sans', sans-serif;
            backdrop-filter: blur(8px);
            outline: none; transition: border-color var(--transition), box-shadow var(--transition);
        }
        .add-word-row input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px var(--accent-glow);
        }
        .add-word-row input::placeholder { color: var(--placeholder-color); }
        .btn-add {
            padding: 10px 22px; border-radius: 50px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            border: none; color: #fff;
            font-weight: 700; font-size: 0.85rem;
            font-family: 'DM Sans', sans-serif;
            cursor: pointer;
            box-shadow: 0 4px 18px var(--accent-glow);
            transition: all var(--transition);
            white-space: nowrap;
        }
        .btn-add:hover { transform: translateY(-2px); box-shadow: 0 8px 28px var(--accent-glow); }
        .btn-add:active { transform: translateY(0); }

        /* ===== VOCAB GRID / LIST ===== */
        .vocab-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
            gap: 14px;
        }
        .vocab-list { display: flex; flex-direction: column; gap: 10px; }

        /* ===== VOCAB CARD ===== */
        .vocab-card {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-top: 1px solid var(--glass-border-bright);
            border-radius: var(--border-radius);
            padding: 20px 20px 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.18);
            transition: transform var(--transition), background var(--transition), box-shadow var(--transition);
            display: flex; flex-direction: column; gap: 8px;
            position: relative;
            animation: cardIn 0.4s cubic-bezier(0.16,1,0.3,1) both;
        }
        @keyframes cardIn {
            from { opacity: 0; transform: translateY(12px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .vocab-card:hover {
            background: var(--card-hover-bg);
            transform: translateY(-3px);
            box-shadow: 0 16px 48px rgba(0,0,0,0.25), 0 0 0 1px var(--glass-border-bright);
        }
        .vocab-card::before {
            content: '';
            position: absolute; top: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
            border-radius: var(--border-radius) var(--border-radius) 0 0;
        }

        .word-display {
            font-family: 'Syne', sans-serif;
            font-weight: 700; font-size: 1.2rem;
            color: var(--text-primary);
            letter-spacing: -0.01em;
        }
        .meaning-display {
            font-size: 0.9rem;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        .highlight {
            background: var(--highlight-bg);
            color: var(--highlight-text);
            padding: 1px 4px;
            border-radius: 5px;
            font-weight: 600;
        }

        .tag-container { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 2px; }
        .tag-badge {
            background: var(--tag-bg);
            color: var(--tag-text);
            padding: 3px 11px; border-radius: 20px;
            font-size: 0.68rem; font-weight: 700;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            cursor: pointer;
            border: 1px solid var(--tag-border);
            transition: all var(--transition);
        }
        .tag-badge:hover {
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            color: #fff; border-color: transparent;
            transform: scale(1.05);
        }

        .card-note-area { margin-top: 6px; }
        .card-note-area textarea {
            width: 100%;
            background: var(--note-bg);
            border: 1px solid var(--note-border);
            border-radius: var(--border-radius-sm);
            padding: 10px 12px;
            color: var(--textarea-color);
            font-size: 0.8rem; font-family: 'DM Sans', sans-serif;
            resize: vertical; min-height: 40px;
            outline: none;
            transition: border-color var(--transition), box-shadow var(--transition);
        }
        .card-note-area textarea:focus {
            border-color: var(--note-focus-border);
            box-shadow: 0 0 0 2px var(--accent-glow);
        }
        .card-note-area textarea::placeholder { color: var(--placeholder-color); }

        .note-save-indicator {
            font-size: 0.68rem; color: var(--success);
            opacity: 0; transition: opacity 0.3s;
            display: block; text-align: right;
            margin-top: 3px; height: 14px;
        }
        .note-save-indicator.show { opacity: 1; }

        .delete-word-btn {
            position: absolute; top: 14px; right: 16px;
            background: transparent; border: none;
            color: var(--text-muted); cursor: pointer;
            opacity: 0; transition: opacity 0.2s, color 0.2s;
            font-size: 0.9rem; padding: 4px;
            border-radius: 8px;
        }
        .vocab-card:hover .delete-word-btn { opacity: 1; }
        .delete-word-btn:hover { color: var(--danger); background: rgba(248,113,113,0.1); }

        .no-result {
            grid-column: 1/-1;
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
            font-size: 1rem;
        }

        /* ===== FOOTER ===== */
        .footer-note {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.78rem;
            padding: 8px;
            letter-spacing: 0.02em;
        }

        /* ===== FLASHCARD OVERLAY ===== */
        .flashcard-overlay {
            position: fixed; inset: 0; z-index: 100;
            background: var(--overlay-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex; align-items: center; justify-content: center;
        }
        .flashcard-container {
            position: relative;
            display: flex; flex-direction: column; align-items: center;
            gap: 20px; width: 100%; max-width: 480px; padding: 32px 20px;
            animation: overlayIn 0.4s cubic-bezier(0.16,1,0.3,1);
        }
        @keyframes overlayIn {
            from { opacity: 0; transform: scale(0.9) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .flashcard-close {
            position: absolute; top: 0; right: 20px;
            background: var(--glass-bg-strong); border: 1px solid var(--glass-border);
            width: 40px; height: 40px; border-radius: 50%;
            color: var(--text-secondary); cursor: pointer;
            font-size: 1.1rem;
            display: flex; align-items: center; justify-content: center;
            transition: all var(--transition);
        }
        .flashcard-close:hover { background: var(--danger); color: #fff; border-color: transparent; }

        .flashcard-card {
            width: 100%; aspect-ratio: 3/2;
            cursor: pointer;
            perspective: 1200px;
            user-select: none;
        }
        .flashcard-inner {
            width: 100%; height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .flashcard-inner.flipped { transform: rotateY(180deg); }
        .flashcard-front, .flashcard-back {
            position: absolute; inset: 0;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border-radius: 24px;
            display: flex; align-items: center; justify-content: center;
            text-align: center; padding: 32px;
            box-shadow: 0 24px 60px rgba(0,0,0,0.4);
        }
        .flashcard-front {
            background: linear-gradient(135deg, rgba(129,140,248,0.2), rgba(167,139,250,0.15));
            border: 1px solid rgba(129,140,248,0.3);
            font-family: 'Syne', sans-serif;
            font-size: 2rem; font-weight: 800;
            color: var(--text-primary);
            backdrop-filter: blur(20px);
        }
        .flashcard-back {
            background: linear-gradient(135deg, rgba(52,211,153,0.15), rgba(129,140,248,0.12));
            border: 1px solid rgba(52,211,153,0.25);
            font-size: 1.3rem; font-weight: 600;
            color: var(--success);
            transform: rotateY(180deg);
            backdrop-filter: blur(20px);
        }
        .flashcard-nav {
            display: flex; align-items: center; gap: 16px;
        }
        #flashcardProgress {
            color: var(--text-secondary); font-size: 0.85rem;
            font-weight: 600; min-width: 60px; text-align: center;
        }
        .flashcard-shuffle {
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            border-radius: 50px; padding: 8px 20px;
            color: var(--text-secondary); cursor: pointer;
            font-size: 0.82rem; font-family: 'DM Sans', sans-serif; font-weight: 600;
            transition: all var(--transition);
        }
        .flashcard-shuffle:hover {
            background: var(--btn-hover-bg); color: var(--text-primary);
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed; bottom: 32px; left: 50%;
            transform: translateX(-50%);
            background: var(--toast-bg);
            color: var(--toast-text);
            padding: 12px 28px; border-radius: 50px;
            font-size: 0.85rem; font-weight: 600;
            z-index: 200;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(16px);
            animation: toastIn 0.3s cubic-bezier(0.16,1,0.3,1);
        }
        @keyframes toastIn {
            from { opacity: 0; transform: translateX(-50%) translateY(16px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(129,140,248,0.3); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(129,140,248,0.5); }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 600px) {
            body { padding: 20px 12px 60px; }
            .header-card { padding: 20px 18px 18px; }
            .title { font-size: 1.15rem; }
            .vocab-grid { grid-template-columns: 1fr; }
            .add-word-row { flex-direction: column; }
            .toolbar .btn { font-size: 0.74rem; padding: 7px 12px; }
        }
    </style>

{ word: "too old to", meaning: "quá già để", tags: ["Cấu trúc"] },
{ word: "wanted sb not to do sth", meaning: "muốn ai không làm gì", tags: ["Cấu trúc"] },
{ word: "more convenient than", meaning: "tiện lợi hơn", tags: ["Cấu trúc"] },
{ word: "too strong to understand", meaning: "quá mạnh / khó để hiểu", tags: ["Cấu trúc"] },
{ word: "not as difficult as", meaning: "không khó bằng", tags: ["Cấu trúc"] },
{ word: "is going to be decided", meaning: "sẽ được quyết định", tags: ["Cấu trúc"] },
{ word: "even though", meaning: "mặc dù (nhấn mạnh hơn although)", tags: ["Cấu trúc"] },
{ word: "so as to", meaning: "để (chỉ mục đích)", tags: ["Cấu trúc"] },
{ word: "despite + V-ing", meaning: "mặc dù (làm gì)", tags: ["Cấu trúc"] }
        // Các từ bổ sung từ test có thể gán tag tương tự (đã rút gọn để code không quá dài, bạn hoàn toàn có thể thêm từ khác với tags tùy ý)
    ];

    const STORAGE_NOTES = 'vocab_notes_data';
    const STORAGE_CUSTOM = 'vocab_custom_words';
    const STORAGE_THEME = 'vocab_theme';
    const STORAGE_VIEW = 'vocab_view';
    const STORAGE_SORT = 'vocab_sort';

    let vocabList = [];
    let notesMap = {};
    let currentView = 'grid';
    let currentSort = 'default';
    let currentTheme = 'dark';
    let currentTagFilter = '';

    let flashcardDeck = [], flashcardIndex = 0, flashcardIsFlipped = false, flashcardShuffled = false;

    // DOM elements
    const vocabGrid = document.getElementById('vocabGrid');
    const searchInput = document.getElementById('searchInput');
    const clearSearchBtn = document.getElementById('clearSearchBtn');
    const totalCountSpan = document.getElementById('totalCount');
    const visibleCountSpan = document.getElementById('visibleCount');
    const addWordBtn = document.getElementById('addWordBtn');
    const newWordInput = document.getElementById('newWordInput');
    const newMeaningInput = document.getElementById('newMeaningInput');
    const newTagsInput = document.getElementById('newTagsInput');
    const themeToggle = document.getElementById('themeToggle');
    const viewGridBtn = document.getElementById('viewGridBtn');
    const viewListBtn = document.getElementById('viewListBtn');
    const openFlashcardBtn = document.getElementById('openFlashcardBtn');
    const flashcardOverlay = document.getElementById('flashcardOverlay');
    const flashcardClose = document.getElementById('flashcardClose');
    const flashcardCard = document.getElementById('flashcardCard');
    const flashcardInner = document.getElementById('flashcardInner');
    const flashcardFront = document.getElementById('flashcardFront');
    const flashcardBack = document.getElementById('flashcardBack');
    const flashcardPrev = document.getElementById('flashcardPrev');
    const flashcardNext = document.getElementById('flashcardNext');
    const flashcardProgress = document.getElementById('flashcardProgress');
    const flashcardShuffleBtn = document.getElementById('flashcardShuffle');
    const sortGroup = document.getElementById('sortGroup');
    const exportBtn = document.getElementById('exportBtn');
    const importBtn = document.getElementById('importBtn');
    const importFileInput = document.getElementById('importFileInput');
    const tagFilterSelect = document.getElementById('tagFilterSelect');

    function loadNotes() { try { notesMap = JSON.parse(localStorage.getItem(STORAGE_NOTES) || '{}'); } catch(e){ notesMap={}; } }
    function saveNotes() { localStorage.setItem(STORAGE_NOTES, JSON.stringify(notesMap)); }
    function loadCustom() { try { return JSON.parse(localStorage.getItem(STORAGE_CUSTOM) || '[]'); } catch(e){ return []; } }
    function saveCustom(cw) { localStorage.setItem(STORAGE_CUSTOM, JSON.stringify(cw)); }
    function loadTheme() { return localStorage.getItem(STORAGE_THEME) || 'dark'; }
    function saveTheme(t) { localStorage.setItem(STORAGE_THEME, t); }
    function loadView() { return localStorage.getItem(STORAGE_VIEW) || 'grid'; }
    function saveView(v) { localStorage.setItem(STORAGE_VIEW, v); }
    function loadSort() { return localStorage.getItem(STORAGE_SORT) || 'default'; }
    function saveSort(s) { localStorage.setItem(STORAGE_SORT, s); }

    function buildVocabList() { vocabList = [...combinedVocabFromNotes, ...loadCustom()]; }
    function getSortedList() {
        const list = [...vocabList];
        if (currentSort === 'az') list.sort((a,b)=> a.word.localeCompare(b.word,'vi',{sensitivity:'base'}));
        else if (currentSort === 'za') list.sort((a,b)=> b.word.localeCompare(a.word,'vi',{sensitivity:'base'}));
        return list;
    }

    function addCustomWord(word, meaning, tagsStr) {
        const tags = tagsStr.split(',').map(t => t.trim()).filter(t => t);
        const cw = loadCustom();
        cw.push({ word: word.trim(), meaning: meaning.trim(), tags });
        saveCustom(cw);
        buildVocabList(); renderAll();
    }
    function deleteCustomWord(idx) {
        if (idx < combinedVocabFromNotes.length) { alert("⚠️ Không thể xoá từ gốc."); return; }
        const ci = idx - combinedVocabFromNotes.length;
        const cw = loadCustom(); if (ci>=0 && ci<cw.length) { cw.splice(ci,1); saveCustom(cw); }
        if (notesMap[String(idx)]) { delete notesMap[String(idx)]; saveNotes(); }
        buildVocabList(); renderAll();
    }

    function escapeHTML(s) { const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
    function highlightText(text, q) {
        if (!q) return escapeHTML(text);
        const escaped = q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
        return escapeHTML(text).replace(new RegExp(`(${escaped})`,'gi'), '<mark class="highlight">$1</mark>');
    }

    function getAllTags() {
        const tagsSet = new Set();
        vocabList.forEach(item => (item.tags || []).forEach(t => tagsSet.add(t)));
        return Array.from(tagsSet).sort();
    }

    function updateTagFilterSelect() {
        const tags = getAllTags();
        tagFilterSelect.innerHTML = '<option value="">🏷️ Tất cả tag</option>';
        tags.forEach(tag => {
            const option = document.createElement('option');
            option.value = tag;
            option.textContent = tag;
            if (tag === currentTagFilter) option.selected = true;
            tagFilterSelect.appendChild(option);
        });
        if (currentTagFilter && !tags.includes(currentTagFilter)) currentTagFilter = '';
    }

    function renderCards() {
        const query = searchInput.value.trim().toLowerCase();
        vocabGrid.innerHTML = ''; let visible = 0;
        const sorted = getSortedList();
        updateTagFilterSelect();
        sorted.forEach(item => {
            const origIdx = vocabList.indexOf(item);
            if (query && !item.word.toLowerCase().includes(query) && !item.meaning.toLowerCase().includes(query)) return;
            if (currentTagFilter && !(item.tags || []).includes(currentTagFilter)) return;
            visible++;
            const noteKey = String(origIdx), savedNote = notesMap[noteKey]||'';
            const card = document.createElement('div'); card.className='vocab-card'; card.dataset.index=origIdx;
            const wd = document.createElement('div'); wd.className='word-display'; wd.innerHTML=highlightText(item.word, query);
            const md = document.createElement('div'); md.className='meaning-display'; md.innerHTML=highlightText(item.meaning, query);
            card.appendChild(wd); card.appendChild(md);
            if (item.tags && item.tags.length) {
                const tagDiv = document.createElement('div'); tagDiv.className='tag-container';
                item.tags.forEach(tag => {
                    const badge = document.createElement('span'); badge.className='tag-badge'; badge.textContent=tag;
                    badge.addEventListener('click', (e) => { e.stopPropagation(); currentTagFilter = tag; renderAll(); });
                    tagDiv.appendChild(badge);
                });
                card.appendChild(tagDiv);
            }
            const na = document.createElement('div'); na.className='card-note-area';
            const ta = document.createElement('textarea'); ta.placeholder='📝 Ghi chú...'; ta.value=savedNote; ta.dataset.noteKey=noteKey;
            let to; ta.addEventListener('input', ()=>{
                notesMap[ta.dataset.noteKey]=ta.value; saveNotes();
                const ind=na.querySelector('.note-save-indicator');
                if(ind){ ind.classList.add('show'); clearTimeout(to); to=setTimeout(()=>ind.classList.remove('show'),900); }
            });
            const indi = document.createElement('span'); indi.className='note-save-indicator'; indi.textContent='✔ Đã lưu';
            na.appendChild(ta); na.appendChild(indi);
            card.appendChild(na);
            if (origIdx >= combinedVocabFromNotes.length) {
                const del = document.createElement('button'); del.className='delete-word-btn'; del.innerHTML='🗑️';
                del.addEventListener('click',e=>{e.stopPropagation(); if(confirm('Xoá từ này?')) deleteCustomWord(origIdx);});
                card.appendChild(del);
            }
            vocabGrid.appendChild(card);
        });
        if (visible===0 && vocabList.length>0) vocabGrid.innerHTML=`<div class="no-result">🔎 Không tìm thấy từ nào.</div>`;
        totalCountSpan.textContent=vocabList.length; visibleCountSpan.textContent=visible;
    }

    function applyViewMode() {
        vocabGrid.className = currentView==='list'?'vocab-list':'vocab-grid';
        viewGridBtn.classList.toggle('active', currentView==='grid');
        viewListBtn.classList.toggle('active', currentView==='list');
    }
    function applySortUI() { sortGroup.querySelectorAll('button').forEach(b=>b.classList.toggle('active', b.dataset.sort===currentSort)); }
    function applyTheme() { document.documentElement.setAttribute('data-theme', currentTheme); themeToggle.innerHTML = currentTheme==='dark'?'☀️ Sáng':'🌙 Tối'; }
    function updateClearBtn() { clearSearchBtn.classList.toggle('hidden', !searchInput.value.trim()); }
    function renderAll() { applyViewMode(); applySortUI(); applyTheme(); renderCards(); updateClearBtn(); }

    // Flashcard
    function buildDeck() {
        const q = searchInput.value.trim().toLowerCase();
        let sorted = getSortedList();
        if (q) sorted = sorted.filter(i=>i.word.toLowerCase().includes(q)||i.meaning.toLowerCase().includes(q));
        if (currentTagFilter) sorted = sorted.filter(i=> (i.tags||[]).includes(currentTagFilter));
        flashcardDeck = [...sorted];
        if (flashcardShuffled) flashcardDeck.sort(()=>Math.random()-0.5);
    }
    function openFlashcard() { buildDeck(); if(!flashcardDeck.length){ alert('Không có từ nào.'); return; } flashcardIndex=0; flashcardIsFlipped=false; updateFlashcard(); flashcardOverlay.style.display='flex'; document.body.style.overflow='hidden'; }
    function closeFlashcard() { flashcardOverlay.style.display='none'; document.body.style.overflow=''; }
    function updateFlashcard() { const item=flashcardDeck[flashcardIndex]; flashcardFront.textContent=item.word; flashcardBack.textContent=item.meaning; flashcardInner.classList.toggle('flipped', flashcardIsFlipped); flashcardProgress.textContent=`${flashcardIndex+1} / ${flashcardDeck.length}`; }
    function flipFlashcard() { flashcardIsFlipped=!flashcardIsFlipped; flashcardInner.classList.toggle('flipped'); }
    function nextFlashcard() { flashcardIndex=(flashcardIndex+1)%flashcardDeck.length; flashcardIsFlipped=false; updateFlashcard(); }
    function prevFlashcard() { flashcardIndex=(flashcardIndex-1+flashcardDeck.length)%flashcardDeck.length; flashcardIsFlipped=false; updateFlashcard(); }
    function shuffleFlashcard() { flashcardShuffled=!flashcardShuffled; flashcardShuffleBtn.textContent=flashcardShuffled?'🔀 Đang xáo':'🔀 Xáo trộn'; buildDeck(); flashcardIndex=0; flashcardIsFlipped=false; updateFlashcard(); }

    function exportData() {
        const data = { customWords: loadCustom(), notes: notesMap };
        const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
        const a = document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`vocab_backup_${new Date().toISOString().slice(0,10)}.json`; a.click();
        showToast('✅ Đã xuất file thành công!');
    }
    function importData(file) {
        const reader = new FileReader();
        reader.onload = e => {
            try {
                const json = JSON.parse(e.target.result);
                if (json.customWords) saveCustom([...loadCustom(), ...json.customWords.filter(w=>w.word)]);
                if (json.notes) { Object.assign(notesMap, json.notes); saveNotes(); }
                buildVocabList(); renderAll(); showToast('📥 Đã nhập dữ liệu.');
            } catch(ex) { alert('File không hợp lệ.'); }
        };
        reader.readAsText(file);
    }
    function showToast(msg) {
        const t = document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t);
        setTimeout(()=>t.remove(), 2500);
    }

    // Event listeners
    searchInput.addEventListener('input', renderAll);
    clearSearchBtn.addEventListener('click', ()=>{ searchInput.value=''; renderAll(); });
    document.addEventListener('keydown', e=>{
        if (e.key==='Escape') {
            if (flashcardOverlay.style.display==='flex') closeFlashcard();
            else if (document.activeElement===searchInput) { searchInput.value=''; renderAll(); }
        }
    });
    addWordBtn.addEventListener('click', ()=>{
        const w=newWordInput.value.trim(), m=newMeaningInput.value.trim();
        if (!w||!m) { alert('Nhập từ và nghĩa.'); return; }
        addCustomWord(w, m, newTagsInput.value);
        newWordInput.value=''; newMeaningInput.value=''; newTagsInput.value=''; newWordInput.focus();
    });
    themeToggle.addEventListener('click', ()=>{ currentTheme=currentTheme==='dark'?'light':'dark'; saveTheme(currentTheme); applyTheme(); });
    viewGridBtn.addEventListener('click', ()=>{ currentView='grid'; saveView('grid'); applyViewMode(); renderCards(); });
    viewListBtn.addEventListener('click', ()=>{ currentView='list'; saveView('list'); applyViewMode(); renderCards(); });
    sortGroup.addEventListener('click', e=>{ if(e.target.tagName==='BUTTON'&&e.target.dataset.sort) { currentSort=e.target.dataset.sort; saveSort(currentSort); applySortUI(); renderCards(); } });
    tagFilterSelect.addEventListener('change', function() { currentTagFilter = this.value; renderAll(); });
    openFlashcardBtn.addEventListener('click', openFlashcard);
    flashcardClose.addEventListener('click', closeFlashcard);
    flashcardOverlay.addEventListener('click', e=>{ if(e.target===flashcardOverlay) closeFlashcard(); });
    flashcardCard.addEventListener('click', flipFlashcard);
    flashcardPrev.addEventListener('click', e=>{ e.stopPropagation(); prevFlashcard(); });
    flashcardNext.addEventListener('click', e=>{ e.stopPropagation(); nextFlashcard(); });
    flashcardShuffleBtn.addEventListener('click', e=>{ e.stopPropagation(); shuffleFlashcard(); });
    document.addEventListener('keydown', e=>{
        if (flashcardOverlay.style.display!=='flex') return;
        if (e.key==='ArrowLeft') prevFlashcard();
        if (e.key==='ArrowRight') nextFlashcard();
        if (e.key===' '||e.key==='Space') { e.preventDefault(); flipFlashcard(); }
    });
    exportBtn.addEventListener('click', exportData);
    importBtn.addEventListener('click', ()=> importFileInput.click());
    importFileInput.addEventListener('change', (e)=>{ if(e.target.files.length) importData(e.target.files[0]); importFileInput.value=''; });

    let touchX=0;
    flashcardCard.addEventListener('touchstart', e=>{ touchX=e.changedTouches[0].screenX; }, {passive:true});
    flashcardCard.addEventListener('touchend', e=>{
        if(flashcardOverlay.style.display!=='flex') return;
        const diff=e.changedTouches[0].screenX-touchX;
        if(Math.abs(diff)>60) diff<0?nextFlashcard():prevFlashcard();
    });

    function init() {
        currentTheme=loadTheme(); currentView=loadView(); currentSort=loadSort();
        loadNotes(); buildVocabList(); renderAll();
    }
    init();
})();
</script>
</body>
</html>
